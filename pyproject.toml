[project]
name = "frontier-signal-mcp"
version = "0.2.0"
description = "MCP server for VE Lab Frontier Signal — query verified AI data-broker buyer programmes and demand signals."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "VE Lab" },
]
keywords = [
    "mcp",
    "fastmcp",
    "frontier-signal",
    "ve-lab",
    "ai-data",
    "buyer-programmes",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "fastmcp>=2.13",
    "pydantic>=2.10",
]

[project.urls]
Homepage = "https://velab.org/frontier-signal/"
Brief = "https://velab.org/frontier-signal/brief/"
Repository = "https://github.com/collectivewinca/frontier-signal-mcp"

[project.scripts]
frontier-signal-mcp = "frontier_signal_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/frontier_signal_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"data" = "frontier_signal_mcp/data"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/data",
    "/tests",
    "/README.md",
    "/CHANGELOG.md",
    "/AGENTS.md",
    "/LICENSE",
    "/server.json",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.uv]
default-groups = ["dev"]
